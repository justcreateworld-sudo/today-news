const catName=c=>(T().cat&&T().cat[c])||I.en.cat[c]||c;
const flagImg=c=>c?`<img class="flag" src="https://flagcdn.com/w40/${esc(String(c).toLowerCase())}.png" width="22" height="16" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:"";
function ago(iso){const m=Math.max(1,Math.round((Date.now()-new Date(iso))/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"}

/* ---------- pictures: photo, then AI image, then drawn illustration ---------- */
function art(t,c){let h=0;for(const ch of t+c)h=(h*31+ch.charCodeAt(0))>>>0;const a=h%360,b=(a+50)%360;let sh="";
 for(let i=0;i<5;i++){const x=(h>>>(i*3))%800,y=(h>>>(i*2+1))%450,r=60+(h>>>(i+2))%120;sh+=`<circle cx="${x}" cy="${y}" r="${r}" fill="hsl(${(a+i*25)%360},70%,70%)" opacity=".18"/>`}
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a},55%,24%)"/><stop offset="1" stop-color="hsl(${b},60%,42%)"/></linearGradient></defs><rect width="800" height="450" fill="url(#g)"/>${sh}<text x="400" y="270" font-size="150" text-anchor="middle">${ICON[c]||"📰"}</text></svg>`;
 return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function imgErr(el){const st=+(el.dataset.s||0);el.dataset.s=st+1;const em=el.nextElementSibling,u=el.dataset.u;
 if(st===0&&el.dataset.p==="photo"&&u){el.src="https://wsrv.nl/?url="+encodeURIComponent(u)+"&w=800&h=450&fit=cover";return}
 el.onerror=null;el.src=art(el.dataset.t,el.dataset.c);if(em)em.textContent=T().ill}

/* ---------- state ---------- */
function langOptions(){if(mode!=="country")return[];return LANGS[sel]||[["en","English"]]}
function fixLang(){if(mode!=="country"){lang="en";return}const o=langOptions();if(!o.some(x=>x[0]===lang))lang="en"}
function go(m,v){mode=m;sel=m==="country"?v:"All";cat=m==="cat"?v:"";shown=24;fixLang();
 $("q").value="";Q="";QR="";closeAll();refresh()}
function refresh(){ui();langBar();dateBar();ticker();renderSide();render();renderVideos()}
function ui(){const t=T();$("q").placeholder=t.ph;$("more").textContent=t.more;$("tl").textContent=t.breaking;$("sh").textContent=t.countries;
 document.documentElement.lang=lang;
 $("clab").textContent=mode==="country"?sel:t.countries;$("cflag").innerHTML=mode==="country"?flagImg(CODES[sel]):IC_GLOBE;
 try{$("date").textContent=new Date().toLocaleDateString(lang==="en"?"en-GB":lang+"-LK",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){$("date").textContent=new Date().toDateString()}
 $("drawer").innerHTML=`<h2>${t.cats}</h2><button class="it" data-m="home" aria-current="${mode==="home"}">${t.all}</button>`+CATS.map(c=>`<button class="it" data-m="cat" data-v="${c}" aria-current="${mode==="cat"&&cat===c}">${esc(catName(c))}</button>`).join("");
 if(!wxOn&&!$("wx").dataset.busy)$("wx").innerHTML=`<button class="chip" id="wxb">${IC_PIN}${t.wx}</button>`}
function dateBar(){const t=T(),td=new Date().toLocaleDateString("en-CA"),yd=new Date(Date.now()-864e5).toLocaleDateString("en-CA");
 const lab=d=>d===td?t.today:d===yd?t.yest:new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
 const rec=DAYS.slice(-3).reverse(),loc=lang==="en"?"en-GB":lang+"-LK";
 let fmt=t.dat;if(DAY){try{fmt=new Date(DAY+"T00:00:00").toLocaleDateString(loc,{day:"numeric",month:"short"})}catch(e){fmt=DAY}}
 $("dates").innerHTML=`<button aria-pressed="${!DAY}" data-d=""><i class="dot"></i>${t.live}</button>`+rec.map(d=>`<button aria-pressed="${DAY===d}" data-d="${d}">${lab(d)}</button>`).join("")+`<span class="dpw"><button id="dpb" aria-pressed="${!!DAY&&!rec.includes(DAY)}" aria-label="${t.pickdate}">${IC_CAL}<span>${fmt}</span></button><input type="date" id="dp" value="${DAY}" ${DAYS.length?`min="${DAYS[0]}" max="${DAYS[DAYS.length-1]}"`:""} tabindex="-1" aria-hidden="true"></span>`}
function setDay(d){DAY=d;shown=24;if(!d){DAYFEED=[];refresh();return}
 fetch(`archive/${encodeURIComponent(d)}.json`,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>{DAYFEED=a;refresh()}).catch(()=>{DAYFEED=[];refresh()})}
function langBar(){const o=langOptions();$("langs").innerHTML=o.length>1?o.map(l=>`<button class="chip" aria-pressed="${lang===l[0]}" data-l="${l[0]}">${esc(l[1])}</button>`).join(""):""}
function ticker(){const by=l=>FEED.filter(s=>s.breaking&&(s.lang||"en")===l);const b=(by(lang).length?by(lang):by("en")).slice(0,10);
 $("tick").textContent=b.map(s=>"● "+(s.country!=="World"?s.country+": ":"")+s.title).join("     ")||"…"}
function renderSide(){const names=Object.keys(LANGS).sort((a,b)=>a==="Sri Lanka"?-1:b==="Sri Lanka"?1:a.localeCompare(b));
 const n={};cur().forEach(s=>{if((s.lang||"en")==="en")n[s.country]=(n[s.country]||0)+1});
 $("clist").innerHTML=`<li><button data-home="1" aria-current="${mode!=="country"}">${IC_GLOBE}<span>${esc(T().all)}</span></button></li>`+names.map(c=>`<li><button data-c="${esc(c)}" aria-current="${mode==="country"&&sel===c}">${flagImg(CODES[c])}<span>${esc(c)}</span><small>${n[c]||0}</small></button></li>`).join("")}

/* ---------- news cards ---------- */
function card(s,lead){const L=T(),c=s.cat||"general";
 const ph=!!s.image&&s.imageType==="photo";const src=ph?s.image:art(s.title,c);const kind=ph?L.photo+": "+esc(s.refs[0][0]):L.ill;
 return `<article class="card${lead?" lead":""}" dir="${RTL.includes(s.lang)?"rtl":"ltr"}">
 <div class="img"><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-u="${esc(ph?s.image:"")}" data-t="${esc(s.title)}" data-c="${esc(c)}" data-p="${ph?"photo":"art"}" onerror="imgErr(this)"><em>${kind}</em></div>
 <div class="body"><div class="meta">${s.breaking&&!DAY?`<span class="badge">${L.breaking}</span>`:""}<span class="topic">${esc(catName(c))}</span>${s.country!=="World"?`<span class="cty">${flagImg(s.code)}${esc(s.country)}</span>`:""}<span>${esc(DAY?new Date(s.published).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):ago(s.published))}${s.translated?" · "+L.tr:""}</span></div>
 <h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(s.title)}</a></h3>${s.summary&&s.summary!==s.title?`<p>${esc(s.summary)}</p>`:""}
 <div class="src"><b>${L.source}:</b>${s.refs.map(r=>`<a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a>`).join("")}<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.title)}" target="_blank" rel="noopener noreferrer">▶ ${L.watch}</a></div></div></article>`}
function render(){const L=T();let list,note="";
 const en=s=>(s.lang||"en")==="en";
 if(mode==="cat"){list=cur().filter(s=>s.cat===cat&&en(s))}
 else{const pool=l=>cur().filter(s=>(mode==="home"||s.country===sel)&&(s.lang||"en")===l);
  list=pool(lang);if(!list.length&&lang!=="en"){list=pool("en");note=L.fallback}}
 list.sort((a,b)=>new Date(b.published)-new Date(a.published));
 if(Q)list=list.filter(s=>(s.title+" "+s.summary).toLowerCase().includes(Q));
function mix(l){const g={};l.forEach(s=>(g[s.country]=g[s.country]||[]).push(s));const q=Object.values(g),o=[];for(let i=0;q.some(a=>a[i]);i++)q.forEach(a=>{if(a[i])o.push(a[i])});return o}
 if(mode==="home"&&!Q){list=mix(list);const li=list.findIndex(s=>s.image&&s.imageType==="photo");if(li>0)list.unshift(list.splice(li,1)[0])}
 $("title").textContent=Q?L.res+": “"+QR+"”":mode==="cat"?catName(cat):mode==="country"?sel+" "+L.news:L.latest;
 $("count").textContent=(DAY?DAY+" · ":"")+list.length+" "+(list.length===1?L.story:L.stories)+(note?" · "+note:"");
 $("grid").innerHTML=list.length?list.slice(0,shown).map((s,i)=>card(s,i===0&&mode==="home"&&!Q)).join(""):`<div class="empty">${DAY?L.nodate:L.empty}</div>`;
 $("more").hidden=list.length<=shown}
function renderVideos(){const own=VIDEOS.filter(v=>mode==="country"&&v.country===sel);const v=(own.length?own:VIDEOS.filter(v=>v.country==="World")).slice(0,8);
 $("vids").innerHTML=v.length&&mode!=="cat"&&!DAY?`<h2>${T().videos}</h2><div class="vg">${v.map(x=>`<figure class="vt" data-v="${esc(x.id)}"><img src="https://i.ytimg.com/vi/${esc(x.id)}/hqdefault.jpg" alt="" loading="lazy"><button aria-label="Play">▶</button><figcaption>${esc(x.title)} · ${esc(x.channel)}</figcaption></figure>`).join("")}</div>`:""}

/* ---------- weather at the visitor's location ---------- */
const WC=[[0,"☀️","Clear"],[1,"🌤️","Mostly clear"],[2,"⛅","Partly cloudy"],[3,"☁️","Cloudy"],[45,"🌫️","Fog"],[51,"🌦️","Drizzle"],[61,"🌧️","Rain"],[71,"❄️","Snow"],[80,"🌦️","Showers"],[95,"⛈️","Thunderstorm"]];
const wcode=c=>{let r=WC[0];for(const w of WC)if(c>=w[0])r=w;return r};
async function loadWx(){const el=$("wx");el.dataset.busy="1";el.textContent=T().wxload;
 try{const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:12000,maximumAge:600000}));
  const la=pos.coords.latitude,lo=pos.coords.longitude;
  const [w,g]=await Promise.all([fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`).then(r=>r.json()),
   fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=en`).then(r=>r.json()).catch(()=>({}))]);
  const c=w.current,x=wcode(c.weather_code),place=[g.city||g.locality||g.principalSubdivision,g.countryName].filter(Boolean).join(", ");
  el.innerHTML=`<span style="display:inline-flex;gap:6px;align-items:center">${IC_PIN}${esc(place)}</span><b>${x[1]} ${Math.round(c.temperature_2m)}°C</b><span>${x[2]}</span><span>💧 ${c.relative_humidity_2m}%</span><span>💨 ${Math.round(c.wind_speed_10m)} km/h</span>`;
  wxOn=true;try{localStorage.setItem("wx","1")}catch(e){}
 }catch(e){el.innerHTML=`<button class="chip" id="wxb">${T().wxfail}</button>`}
 delete el.dataset.busy}

/* ---------- menus and events ---------- */
function closeAll(){$("drawer").classList.remove("open");$("cdrawer").classList.remove("open");$("scrim").hidden=true;$("burger").setAttribute("aria-expanded","false");$("cbtn").setAttribute("aria-expanded","false")}
$("burger").addEventListener("click",()=>{const o=!$("drawer").classList.contains("open");closeAll();if(o){$("drawer").classList.add("open");$("scrim").hidden=false;$("burger").setAttribute("aria-expanded","true")}});
$("scrim").addEventListener("click",closeAll);
$("cbtn").addEventListener("click",()=>{const o=!$("cdrawer").classList.contains("open");closeAll();if(o){$("cdrawer").classList.add("open");$("scrim").hidden=false;$("cbtn").setAttribute("aria-expanded","true")}});
$("drawer").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)go(b.dataset.m,b.dataset.v)});
$("clist").addEventListener("click",e=>{const b=e.target.closest("[data-c],[data-home]");if(b){if(b.dataset.home)go("home");else go("country",b.dataset.c)}});
$("dates").addEventListener("click",e=>{if(e.target.closest("#dpb")){const i=$("dp");try{i.showPicker()}catch(_){try{i.focus();i.click()}catch(__){}}return}const b=e.target.closest("[data-d]");if(b)setDay(b.dataset.d)});
$("dates").addEventListener("change",e=>{if(e.target.id==="dp")setDay(e.target.value)});
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){lang=b.dataset.l;shown=24;refresh()}});
$("more").addEventListener("click",()=>{shown+=24;render()});
$("wx").addEventListener("click",e=>{if(e.target.closest("#wxb"))loadWx()});
$("vids").addEventListener("click",e=>{const f=e.target.closest("[data-v]");if(f&&!f.classList.contains("on")){f.classList.add("on");f.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${esc(f.dataset.v)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe>`}});
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{QR=e.target.value.trim();Q=QR.toLowerCase();shown=24;render()},150)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

ui();
fetch("news.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
 FEED=d.stories||[];LANGS=d.languages||{};CODES=d.codes||{};VIDEOS=d.videos||[];
 $("note").textContent="Updated "+new Date(d.updated).toLocaleString()+". Photos belong to their news channels. AI images and translations are marked. Always check the original source.";
 refresh();
 fetch("archive/index.json",{cache:"no-store"}).then(r=>r.json()).then(a=>{DAYS=a;dateBar()}).catch(()=>{});
 try{if(localStorage.getItem("wx")==="1")loadWx()}catch(e){}
}).catch(()=>{$("grid").innerHTML='<div class="empty">News is loading. Please check back in a few minutes.</div>'});
</script>
</body>
</html>
