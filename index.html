<!DOCTYPE html>
<html lang="en">
<head>

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Today News","url":"https://justcreateworld-sudo.github.io/today-news/","description":"World news sorted by country, with photos and sources."}</script>

<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#101a2b;--mut:#5b6678;--line:#dfe4ec;--acc:#0a6e8a;--red:#d62839;--chip:#e6f1f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--card:#152033;--ink:#e8edf5;--mut:#9aa7bb;--line:#243249;--acc:#4fc3de;--chip:#1b2c42;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--card:#152033;--ink:#e8edf5;--mut:#9aa7bb;--line:#243249;--acc:#4fc3de;--chip:#1b2c42;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);background:var(--card)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font:800 24px Georgia,"Times New Roman",serif;letter-spacing:-.5px}.logo i{font-style:normal;color:var(--red)}
.date{color:var(--mut);font-size:13px}
.ticker{background:var(--red);color:#fff;font-size:14px;overflow:hidden;white-space:nowrap}
.ticker div{display:inline-block;padding:8px 0 8px 100%;animation:t 45s linear infinite}
@keyframes t{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.ticker div{animation:none;padding-left:18px}}
.hero{padding:44px 0 22px}
.hero h1{font:700 clamp(30px,5vw,50px)/1.1 Georgia,serif;margin:0 0 8px;letter-spacing:-1px;max-width:760px}
.hero p{color:var(--mut);margin:0 0 20px;max-width:560px}
.sw{position:relative;max-width:560px}
.sw input{width:100%;font:inherit;font-size:18px;padding:16px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.sw input:focus-visible{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5;box-shadow:0 10px 30px #0003}
.sug button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:11px 16px;cursor:pointer}
.sug button:hover,.sug button.on{background:var(--chip)}.sug small{margin-left:auto;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:7px 13px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:focus-visible,.sug button:focus-visible,.src a:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 14px;gap:10px;flex-wrap:wrap}
.head h2{font:700 26px Georgia,serif;margin:0}.head span{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card.lead{grid-column:1/-1;flex-direction:row}.card.lead .img{width:48%;height:auto;min-height:260px}.card.lead h3{font-size:28px}
@media(max-width:720px){.card.lead{flex-direction:column}.card.lead .img{width:100%;height:200px;min-height:0}}
.img{height:170px;display:grid;place-items:center;font-size:60px;position:relative;color:#fff}
.img em{position:absolute;left:10px;bottom:8px;font:600 11px system-ui;background:#0009;padding:3px 8px;border-radius:99px}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
.badge{background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:5px}
.cty{font-weight:700;color:var(--acc)}
.card h3{font:700 20px/1.25 Georgia,serif;margin:0}.card p{margin:0;color:var(--mut);font-size:15px}
.src{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.src b{color:var(--mut);font-weight:600}
.src a{color:var(--ink);text-decoration:none;background:var(--chip);padding:4px 10px;border-radius:99px}
.src a:hover{text-decoration:underline}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
.note{background:var(--chip);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--mut);margin-bottom:40px}
footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><div class="wrap bar"><div class="logo">Today<i>News</i></div><div class="date" id="date"></div></div></header>
<div class="ticker" aria-label="Breaking news"><div id="tick"></div></div>

<main class="wrap">
 <section class="hero">
  <h1 id="h1">World news, sorted by country</h1>
  <p id="sub">Type a country name and see only its news. Every story links to the news channels and social posts it came from.</p>
  <div class="sw">
   <input id="q" type="search" placeholder="Search a country, e.g. Sri Lanka" autocomplete="off" aria-label="Search country" role="combobox" aria-expanded="false" aria-controls="sug">
   <div class="sug" id="sug" role="listbox" hidden></div>
  </div>
  <div class="chips" id="langs" role="group" aria-label="Language"></div>
  <div class="chips" id="chips" role="group" aria-label="Countries"></div>
 </section>

 <div class="head"><h2 id="title">Breaking news</h2><span id="count"></span></div>
 <noscript><p>Today News needs JavaScript to show stories. It lists the latest news for about 60 countries, with photos and sources.</p></noscript>
 <div class="grid" id="grid"></div>
 <div style="text-align:center;padding-bottom:40px"><button class="chip" id="more" hidden>Show more stories</button></div>
 <div class="note" id="note"></div>
</main>
<footer><div class="wrap">Today News · Always check the original sources linked on each story.</div></footer>

<script>
let FEED=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let countries=[];
function buildCountries(){countries=[...new Map(FEED.map(s=>[s.country,s.flag])).entries()].map(([n,f])=>({n,f,k:FEED.filter(s=>s.country===n&&(s.lang||"en")==="en").length}));const PIN=["Sri Lanka","India","United Kingdom","United States","Australia","Japan"];const r=n=>PIN.includes(n)?PIN.indexOf(n):99;countries.sort((a,b)=>r(a.n)-r(b.n)||a.n.localeCompare(b.n))}
function ago(iso){const m=Math.max(1,Math.round((Date.now()-new Date(iso))/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"}
let sel="All";
$("date").textContent=new Date().toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

const I={
en:{h1:"World news, sorted by country",sub:"Type a country name and see only its news. Every story links to the news channels it came from.",ph:"Search a country, e.g. Sri Lanka",latest:"Latest news",news:"news",stories:"stories",story:"story",more:"Show more stories",breaking:"BREAKING",source:"Source",photo:"Photo",ai:"AI image",all:"All",morec:n=>"+"+n+" more countries",fewer:"Show fewer",fallback:"No stories in this language yet. Showing English.",tr:"AI translation",empty:"No stories for this country yet. Try another country."},
si:{h1:"රටවල් අනුව ලෝක පුවත්",sub:"රටක නම ටයිප් කර එහි පුවත් පමණක් බලන්න. සෑම පුවතක්ම ලබාගත් මූලාශ්‍රයට සම්බන්ධයි.",ph:"රටක් සොයන්න, උදා: Sri Lanka",latest:"නවතම පුවත්",news:"පුවත්",stories:"පුවත්",story:"පුවතක්",more:"තවත් පුවත් පෙන්වන්න",breaking:"හදිසි පුවත",source:"මූලාශ්‍රය",photo:"ඡායාරූපය",ai:"AI රූපය",all:"සියල්ල",morec:n=>"තවත් රටවල් "+n,fewer:"අඩුවෙන් පෙන්වන්න",fallback:"මෙම භාෂාවෙන් තවම පුවත් නැත. ඉංග්‍රීසි පුවත් පෙන්වයි.",tr:"AI පරිවර්තනය",empty:"මෙම රට සඳහා තවම පුවත් නැත."},
ta:{h1:"நாடு வாரியாக உலகச் செய்திகள்",sub:"ஒரு நாட்டின் பெயரை உள்ளிட்டு அதன் செய்திகளை மட்டும் பாருங்கள். ஒவ்வொரு செய்தியும் அதன் மூலத்துடன் இணைக்கப்பட்டுள்ளது.",ph:"நாட்டைத் தேடுங்கள், எ.கா. Sri Lanka",latest:"சமீபத்திய செய்திகள்",news:"செய்திகள்",stories:"செய்திகள்",story:"செய்தி",more:"மேலும் செய்திகளைக் காட்டு",breaking:"முக்கிய செய்தி",source:"ஆதாரம்",photo:"படம்",ai:"AI படம்",all:"அனைத்தும்",morec:n=>"மேலும் "+n+" நாடுகள்",fewer:"குறைவாகக் காட்டு",fallback:"இந்த மொழியில் செய்திகள் இன்னும் இல்லை. ஆங்கிலச் செய்திகள் காட்டப்படுகின்றன.",tr:"AI மொழிபெயர்ப்பு",empty:"இந்த நாட்டுக்கு இன்னும் செய்திகள் இல்லை."}};
const ALIAS={"Sri Lanka":["ශ්‍රී ලංකා","இலங்கை"],"India":["ඉන්දියාව","இந்தியா"]};
const RTL=["ar","ur","fa","he","ps","dv"];
let shown=24,showAllChips=false,lang="en",LANGS={};
const T=()=>I[lang]||I.en;
function langOptions(){return sel==="All"?[["en","English"],["si","සිංහල"],["ta","தமிழ்"]]:(LANGS[sel]||[["en","English"]])}
function fixLang(){if(!langOptions().some(x=>x[0]===lang))lang="en"}
function langBar(){const o=langOptions();$("langs").innerHTML=o.length>1?o.map(l=>`<button class="chip" aria-pressed="${lang===l[0]}" data-l="${l[0]}">${esc(l[1])}</button>`).join(""):""}
function ui(){$("h1").textContent=T().h1;$("sub").textContent=T().sub;$("q").placeholder=T().ph;$("more").textContent=T().more;document.documentElement.lang=lang}
function chips(){
 const all=[{n:"All",f:"🌍"},...countries];
 const vis=showAllChips?all:all.filter((c,i)=>i<9||c.n===sel);
 $("chips").innerHTML=vis.map(c=>`<button class="chip" aria-pressed="${sel===c.n}" data-c="${esc(c.n)}">${c.f} ${esc(c.n==="All"?T().all:c.n)}</button>`).join("")+(all.length>9?`<button class="chip" id="tog">${showAllChips?T().fewer:T().morec(all.length-9)}</button>`:"");
}
function render(){
 const L=T();
 const pool=l=>FEED.filter(s=>(sel==="All"||s.country===sel)&&(s.lang||"en")===l);
 let list=pool(lang),note="";
 if(!list.length&&lang!=="en"){list=pool("en");note=L.fallback}
 list.sort((a,b)=>new Date(b.published)-new Date(a.published));
 if(sel==="All"){const n={};list=list.filter(s=>(n[s.country]=(n[s.country]||0)+1)<=2);const li=list.findIndex(s=>s.image);if(li>0)list.unshift(list.splice(li,1)[0])}
 $("title").textContent=sel==="All"?L.latest:sel+" "+L.news;
 $("count").textContent=list.length+" "+(list.length===1?L.story:L.stories)+(note?" · "+note:"");
 const vis=list.slice(0,shown);
 $("grid").innerHTML=vis.length?vis.map((s,i)=>`<article class="card${i===0&&sel==="All"?" lead":""}" dir="${RTL.includes(s.lang)?"rtl":"ltr"}">
  <div class="img" style="background:linear-gradient(135deg,${s.c[0]},${s.c[1]})" role="img" aria-label="${esc(s.title)}"><span style="font:800 46px Georgia,serif;opacity:.85">${esc(s.code||s.emoji)}</span>${s.image?`<img src="${esc(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:""}<em>${s.imageType==="photo"?L.photo+": "+esc(s.refs[0][0]):L.ai}</em></div>
  <div class="body"><div class="meta">${s.breaking?`<span class="badge">${L.breaking}</span>`:''}<span class="cty">${s.flag} ${esc(s.country)}</span><span>· ${esc(ago(s.published))}${s.translated?" · "+L.tr:""}</span></div>
  <h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none">${esc(s.title)}</a></h3><p>${esc(s.summary)}</p>
  <div class="src"><b>${L.source}:</b>${s.refs.map(r=>`<a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">${esc(r[0])}</a>`).join("")}</div></div></article>`).join("")
  :`<div class="empty">${L.empty}</div>`;
 $("more").hidden=list.length<=shown;
 chips();
}
function pick(n){sel=n;shown=24;fixLang();$("q").value=n==="All"?"":n;hide();ui();langBar();render()}
function hide(){$("sug").hidden=true;$("q").setAttribute("aria-expanded","false")}
$("langs").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){lang=b.dataset.l;shown=24;ui();langBar();render()}});
$("chips").addEventListener("click",e=>{if(e.target.id==="tog"){showAllChips=!showAllChips;chips();return}const b=e.target.closest("[data-c]");if(b)pick(b.dataset.c)});
$("q").addEventListener("input",e=>{
 const v=e.target.value.trim().toLowerCase();
 if(!v){sel="All";fixLang();ui();langBar();hide();render();return}
 const m=countries.filter(c=>c.n.toLowerCase().includes(v)||(ALIAS[c.n]||[]).some(a=>a.includes(v))).sort((a,b)=>a.n.toLowerCase().indexOf(v)-b.n.toLowerCase().indexOf(v)).slice(0,8);
 $("sug").innerHTML=m.length?m.map(c=>`<button role="option" data-c="${esc(c.n)}">${c.f} ${esc(c.n)}<small>${c.k} stories</small></button>`).join(""):`<div style="padding:12px 16px;color:var(--mut)">No country matches “${esc(v)}”</div>`;
 $("sug").hidden=false;$("q").setAttribute("aria-expanded","true");
 if(m.length===1){sel=m[0].n;fixLang();ui();langBar();render()}
});
$("q").addEventListener("keydown",e=>{
 if(e.key==="Enter"){const b=$("sug").querySelector("button");if(b)pick(b.dataset.c)}
 if(e.key==="Escape")hide();
});
$("sug").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b)pick(b.dataset.c)});
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))hide()});
fetch("news.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
 FEED=d.stories;LANGS=d.languages||{};buildCountries();ui();langBar();$("more").addEventListener("click",()=>{shown+=24;render()});
 $("tick").textContent=FEED.filter(s=>s.breaking&&(s.lang||"en")==="en").slice(0,8).map(s=>"● "+s.country+": "+s.title).join("     ")||"Latest world news";
 $("note").textContent="Updated "+new Date(d.updated).toLocaleString()+". Images are AI-generated illustrations. Summaries link to the original sources.";
 render();
}).catch(()=>{$("grid").innerHTML='<div class="empty">News is loading. Please check back in a few minutes.</div>'});
</script>
</body>
</html>
